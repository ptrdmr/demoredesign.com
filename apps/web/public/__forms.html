<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <!-- Hidden form for Netlify build-time detection (submissions handled by the React form) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <p hidden>
        <label>Don&apos;t fill this out: <input name="bot-field" /></label>
      </p>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="venueType">
        <option value="Restaurant">Restaurant</option>
        <option value="Diner">Diner</option>
        <option value="Bowling">Bowling</option>
        <option value="Bar-Grill">Bar-Grill</option>
        <option value="Family Entertainment Center">Family Entertainment Center</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" name="city" />
      <input type="text" name="seatsOrLanes" />
      <input type="text" name="deadDaypart" />
      <input type="url" name="websiteUrl" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
